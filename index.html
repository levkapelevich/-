<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лев Капелевич | Личная страница</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            --text-color: #ffffff;
            --accent: #3b82f6;
            --secondary: #0ea5e9;
            --cyan: #22d3ee;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background-color: #0f172a;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background blobs */
        .background-blobs {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: -1;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.5;
            border-radius: 50%;
            animation: float 25s infinite alternate ease-in-out;
        }

        .blob-1 { width: 450px; height: 450px; background: #2563eb; top: -10%; left: -5%; }
        .blob-2 { width: 550px; height: 550px; background: #0ea5e9; bottom: -15%; right: -5%; animation-delay: -5s; }
        .blob-3 { width: 350px; height: 350px; background: #06b6d4; top: 30%; right: 20%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 80px) scale(1.1); }
            100% { transform: translate(-40px, -40px) scale(0.9); }
        }

        /* Main Glassmorphism Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: var(--glass-shadow);
            width: 100%;
            max-width: 900px;
            padding: 40px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }

        .lang-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255,255,255,0.7);
            padding: 8px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .lang-btn.active, .lang-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            color: #fff;
            border-color: rgba(59, 130, 246, 0.4);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.15rem;
            color: #94a3b8;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
        }

        /* Section styles */
        .section-card {
            background: rgba(15, 23, 42, 0.3);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            color: #f1f5f9;
            width: 100%;
        }

        h2 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
        }

        h2::before {
            content: '';
            width: 8px; height: 8px;
            background: var(--secondary);
            border-radius: 2px;
            box-shadow: 0 0 12px var(--secondary);
        }

        .chevron {
            display: none;
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        /* Tags container */
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }

        .tag {
            background: rgba(14, 165, 233, 0.1);
            color: #7dd3fc;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(14, 165, 233, 0.2);
            transition: transform 0.2s;
        }
        
        .tag:hover {
            transform: scale(1.05);
            background: rgba(14, 165, 233, 0.2);
        }

        /* Contact list */
        .contacts-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        .contacts-list a {
            color: #e2e8f0;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .contacts-list a:hover {
            background: rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        /* Projects list */
        .full-width {
            grid-column: 1 / -1;
        }

        .projects-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 18px;
        }

        .project-item {
            padding: 18px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: 0.3s;
        }

        .project-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(14, 165, 233, 0.3);
            transform: translateY(-3px);
        }

        .project-name { font-weight: 700; color: #fff; font-size: 1.1rem; }
        .project-desc { font-size: 0.9rem; color: #94a3b8; margin-top: 6px; line-height: 1.5; }

        /* Footer */
        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            color: rgba(148, 163, 184, 0.6);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .footer-email {
            display: block;
            margin-top: 6px;
            color: var(--secondary);
            text-decoration: none;
            opacity: 0.8;
            transition: 0.3s;
        }

        .footer-email:hover { opacity: 1; text-decoration: underline; }

        /* Mobile adaptation */
        @media (max-width: 800px) {
            .content-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .full-width { grid-column: auto; }
            .glass-card { padding: 30px 20px; }
            h1 { font-size: 2.2rem; }
            .chevron { display: block; }
            .section-card { cursor: pointer; }

            .section-content {
                max-height: 0;
                opacity: 0;
                transition: max-height 0.5s ease, opacity 0.3s ease;
            }

            .section-card.expanded .section-content {
                max-height: 1200px;
                opacity: 1;
                margin-top: 18px;
                padding-bottom: 10px;
            }

            .section-card.expanded .chevron { transform: rotate(180deg); }
            .projects-list { grid-template-columns: 1fr; }
        }

        /* RTL support for Hebrew */
        [dir="rtl"] .contacts-list a:hover { transform: translateY(-2px); }
        [dir="rtl"] .subtitle, [dir="rtl"] h1, [dir="rtl"] .project-item { text-align: right; }
        [dir="rtl"] footer { text-align: center; }
        [dir="rtl"] h2::before { margin-left: 10px; margin-right: 0; }
    </style>
</head>

        };

        function setLanguage(lang) {
            const t = translations[lang];
            document.getElementById('name').textContent = t.name;
            document.getElementById('about').textContent = t.about;
            document.getElementById('skills-title').textContent = t.skillsTitle;
            document.getElementById('projects-title').textContent = t.projectsTitle;
            document.getElementById('contacts-title').textContent = t.contactsTitle;
            document.getElementById('footer-text').innerHTML = t.footer;
            document.documentElement.setAttribute('dir', t.dir);

            const tagContainer = document.getElementById('tag-container');
            tagContainer.innerHTML = '';
            t.tags.forEach(tagName => {
                const span = document.createElement('span');
                span.className = 'tag';
                span.textContent = tagName;
                tagContainer.appendChild(span);
            });

            const projectsList = document.getElementById('projects-list');
            projectsList.innerHTML = '';
            t.projects.forEach(p => {
                const div = document.createElement('div');
                div.className = 'project-item';
                div.innerHTML = `<div class="project-name">${p.name}</div><div class="project-desc">${p.desc}</div>`;
                projectsList.appendChild(div);
            });
            
            const buttons = document.querySelectorAll('.lang-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            const activeBtn = Array.from(buttons).find(b => b.textContent.toLowerCase().includes(lang));
            if(activeBtn) activeBtn.classList.add('active');
        }

        function toggleSection(element) {
            if (window.innerWidth <= 800) {
                element.classList.toggle('expanded');
            }
        }

        window.addEventListener('resize', () => {
            if (window.innerWidth > 800) {
                document.querySelectorAll('.section-card').forEach(card => card.classList.remove('expanded'));
            }
        });

        window.onload = () => {
            setLanguage('ru');
            if (window.innerWidth <= 800) {
                document.querySelector('.section-card').classList.add('expanded');
            }
        };
    </script>
